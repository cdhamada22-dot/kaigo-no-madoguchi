<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ完了 | かいごの窓口</title>
    <meta name="description" content="かいごの窓口へのお問い合わせが完了しました。">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="thanks-page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="かいごの窓口">
        <img class="brand-logo" src="./assets/kaigo-logo.png" alt="介護の窓口">
      </a>
      <a class="nav-cta" href="./index.html#contact">お問い合わせ</a>
    </header>

    <main class="thanks-main">
      <section class="thanks-shell" aria-labelledby="thanks-title">
        <div class="thanks-icon" aria-hidden="true">✓</div>
        <p class="thanks-label">送信完了</p>
        <h1 id="thanks-title">お問い合わせ完了しました</h1>
        <p class="thanks-lead">担当者からご連絡させていただきます。</p>

        <div class="thanks-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">お問い合わせ内容</h2>
          <dl class="summary-list">
            <div>
              <dt>入居希望者の年齢</dt>
              <dd data-summary="resident_age">-</dd>
            </div>
            <div>
              <dt>介護度</dt>
              <dd data-summary="care_level">-</dd>
            </div>
            <div>
              <dt>希望エリア</dt>
              <dd data-summary="area">-</dd>
            </div>
            <div>
              <dt>入居希望時期</dt>
              <dd data-summary="timing">-</dd>
            </div>
            <div>
              <dt>氏名</dt>
              <dd data-summary="name">-</dd>
            </div>
            <div>
              <dt>お電話番号</dt>
              <dd data-summary="tel">-</dd>
            </div>
            <div>
              <dt>メールアドレス</dt>
              <dd data-summary="email">-</dd>
            </div>
            <div>
              <dt>お問い合わせ種別</dt>
              <dd data-summary="inquiry_type">-</dd>
            </div>
            <div class="summary-wide">
              <dt>備考</dt>
              <dd data-summary="message">-</dd>
            </div>
          </dl>
        </div>

        <a class="primary-button thanks-button" href="./index.html">トップへ戻る</a>
      </section>
    </main>

    <script src="./thanks.js"></script>
  </body>
</html>
